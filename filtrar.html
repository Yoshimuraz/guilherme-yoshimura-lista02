<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>filtrar.html</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
  }
  h1 {
    font-size: 28px;
  }
  input {
    padding: 8px;
    width: 250px;
    font-size: 14px;
    margin-bottom: 15px;
  }
  ul {
    list-style-type: disc;
    padding-left: 25px;
  }
  li {
    font-size: 16px;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<h1>filtrar.html</h1>
<p>Crie um campo de entrada que filtre os itens de uma lista conforme o usuário digita.</p>

<input type="text" id="filtro" placeholder="Digite um nome...">

<ul id="lista">
  <li>João</li>
  <li>Márcio</li>
  <li>Fabiana</li>
  <li>Jorge</li>
  <li>Silvana</li>
  <li>Luiz</li>
  <li>Carlos</li>
  <li>Pablo</li>
</ul>

<script>
  const filtro = document.getElementById('filtro');
  const itens = document.querySelectorAll('#lista li');

  filtro.addEventListener('input', function() {
    const termo = filtro.value.toLowerCase();

    itens.forEach(function(item) {
      const texto = item.textContent.toLowerCase();
      if (texto.includes(termo)) {
        item.style.display = '';
      } else {
        item.style.display = 'none';
      }
    });
  });
</script>

</body>
</html>
